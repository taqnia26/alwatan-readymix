openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AlWatan Ready-Mix Company public website and admin CMS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public website content
  - name: quotes
    description: Quote request flows
  - name: admin
    description: Admin CMS operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/home:
    get:
      operationId: getHome
      tags: [public]
      summary: Get the homepage content
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePayload"
  /public/content/{pageSlug}:
    get:
      operationId: getPageContent
      tags: [public]
      summary: Get CMS content for a page
      parameters:
        - $ref: "#/components/parameters/PageSlug"
      responses:
        "200":
          description: Page content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageContent"
  /products:
    get:
      operationId: listProducts
      tags: [public]
      summary: List ready-mix products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [admin]
      security: [{ cookieAuth: [] }]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [public]
      summary: Get a product by slug
      parameters:
        - $ref: "#/components/parameters/ProductSlug"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      tags: [admin]
      security: [{ cookieAuth: [] }]
      summary: Update a product
      parameters:
        - $ref: "#/components/parameters/ProductSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [admin]
      security: [{ cookieAuth: [] }]
      summary: Delete a product
      parameters:
        - $ref: "#/components/parameters/ProductSlug"
      responses:
        "204":
          description: Deleted
  /branches:
    get:
      operationId: listBranches
      tags: [public]
      summary: List company branches
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      operationId: createBranch
      tags: [admin]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Created branch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
  /certificates:
    get:
      operationId: listCertificates
      tags: [public]
      summary: List certificates
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createCertificate
      tags: [admin]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateInput" }
      responses:
        "201":
          description: Created certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
  /blog:
    get:
      operationId: listBlogPosts
      tags: [public]
      summary: List published blog posts
      responses:
        "200":
          description: Blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"
    post:
      operationId: createBlogPost
      tags: [admin]
      security: [{ cookieAuth: [] }]
      summary: Create a blog post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
  /blog/{slug}:
    get:
      operationId: getBlogPost
      tags: [public]
      summary: Get a blog post
      parameters:
        - $ref: "#/components/parameters/BlogSlug"
      responses:
        "200":
          description: Blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateBlogPost
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/BlogSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlogPostUpdate" }
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlogPost" }
    delete:
      operationId: deleteBlogPost
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/BlogSlug"
      responses:
        "204": { description: Deleted }
  /quotes:
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Submit a quote request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Quote request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      security: [{ cookieAuth: [] }]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/quotes:
    get:
      operationId: listQuotes
      tags: [admin]
      security: [{ cookieAuth: [] }]
      summary: List quote requests
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Quote requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedQuotes"
  /admin/quotes/{id}:
    get:
      operationId: getQuote
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Quote request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteRequest" }
    patch:
      operationId: updateQuoteStatus
      tags: [admin]
      security: [{ cookieAuth: [] }]
      summary: Update quote status
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteStatusUpdate"
      responses:
        "200":
          description: Updated quote request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"
    delete:
      operationId: deleteQuote
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "204": { description: Deleted }
  /admin/content:
    get:
      operationId: listPageContent
      tags: [admin]
      security: [{ cookieAuth: [] }]
      summary: List editable CMS content
      responses:
        "200":
          description: Editable content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageContent"
  /admin/content/{id}:
    patch:
      operationId: updatePageContent
      tags: [admin]
      security: [{ cookieAuth: [] }]
      summary: Update a CMS field
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageContentUpdate"
      responses:
        "200":
          description: Updated CMS field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageContent"
  /settings/public:
    get:
      operationId: getPublicSettings
      tags: [public]
      summary: Get public contact settings
      responses:
        "200":
          description: Public settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"
  /auth/login:
    post:
      operationId: login
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
  /auth/logout:
    post:
      operationId: logout
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        "204": { description: Logged out }
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMeResponse" }
  /admin/branches:
    get:
      operationId: listAdminBranches
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: All branches
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Branch" } }
  /branches/{id}:
    patch:
      operationId: updateBranch
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchUpdate" }
      responses:
        "200":
          description: Updated branch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
    delete:
      operationId: deleteBranch
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "204": { description: Deleted }
  /admin/certificates:
    get:
      operationId: listAdminCertificates
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: All certificates
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
  /certificates/{id}:
    patch:
      operationId: updateCertificate
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateUpdate" }
      responses:
        "200":
          description: Updated certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
    delete:
      operationId: deleteCertificate
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "204": { description: Deleted }
  /admin/blog:
    get:
      operationId: listAdminBlogPosts
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: All blog posts including drafts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BlogPost" } }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Admin users
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
    post:
      operationId: createAdminUser
      tags: [admin]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserInput" }
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin/users/{id}/status:
    patch:
      operationId: setAdminUserStatus
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserStatusUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin/users/{id}/password:
    post:
      operationId: changeAdminUserPassword
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin/quotes.csv:
    get:
      operationId: exportQuotes
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: UTF-8 BOM CSV export
          content:
            text/csv: { schema: { type: string } }
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: All site settings
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteSettingsUpdate" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }
  /contact:
    post:
      operationId: createContactMessage
      tags: [quotes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactMessageInput" }
      responses:
        "201":
          description: Message submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactSubmission" }
  /admin/contact:
    get:
      operationId: listContactMessages
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Contact messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedContactMessages" }
  /admin/contact/{id}:
    get:
      operationId: getContactMessage
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: Contact message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactMessage" }
    patch:
      operationId: updateContactMessageStatus
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactStatusUpdate" }
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactMessage" }
    delete:
      operationId: deleteContactMessage
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "204": { description: Deleted }
  /storage/uploads/request-url:
    post:
      operationId: requestMediaUpload
      tags: [admin]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaUploadRequest" }
      responses:
        "200":
          description: Short-lived upload URL (local signed token or opt-in Replit URL)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUploadResponse" }
  /storage/uploads/direct:
    put:
      operationId: uploadLocalMedia
      tags: [public]
      description: Local driver only. Streams raw file bytes using a single-use token; no session cookie required.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, maxLength: 2048 }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
          video/mp4: { schema: { type: string, format: binary } }
          video/webm: { schema: { type: string, format: binary } }
      responses:
        "204": { description: Bytes verified and stored }
        "400": { description: Invalid size }
        "403": { description: Invalid token }
        "405": { description: Not enabled for this driver }
        "409": { description: Token already used or object exists }
        "410": { description: Token expired }
        "413": { description: Upload exceeds its size cap }
        "415": { description: Content type or file signature mismatch }
  /admin/media:
    get:
      operationId: listMedia
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Media assets
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MediaAsset" } }
  /admin/media/finalize:
    post:
      operationId: finalizeMedia
      tags: [admin]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaFinalizeInput" }
      responses:
        "201":
          description: Media asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
  /admin/media/{id}:
    delete:
      operationId: deleteMedia
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "204": { description: Deleted }
        "409": { description: Asset is referenced }
  /storage/objects/{path}:
    get:
      operationId: serveMedia
      tags: [public]
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Object bytes }
        "206": { description: Partial object bytes }
        "416": { description: Invalid byte range }
        "404": { description: Missing object }
  /storage/public-objects/{filePath}:
    get:
      operationId: servePublicMedia
      tags: [public]
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Public object bytes }
  /public/studio:
    get:
      operationId: getPublicStudio
      tags: [public]
      responses:
        "200":
          description: Published website configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioConfig" }
  /admin/studio:
    get:
      operationId: getAdminStudio
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Draft and published website configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioState" }
    put:
      operationId: saveStudioDraft
      tags: [admin]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudioDraftInput" }
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioState" }
  /admin/studio/publish:
    post:
      operationId: publishStudio
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Draft published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioState" }
  /public/activity:
    post:
      operationId: recordSiteActivity
      tags: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteActivityInput" }
      responses:
        "204": { description: Recorded }
  /admin/insights:
    get:
      operationId: getSiteInsights
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, format: int32, enum: [7, 30, 90], default: 30 }
      responses:
        "200":
          description: First-party website activity and sales inquiries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteInsights" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: alwatan_admin_session
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: number
    PageSlug:
      name: pageSlug
      in: path
      required: true
      schema:
        type: string
    ProductSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    BlogSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema: { type: number, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: number, minimum: 1, maximum: 100, default: 20 }
    Status:
      name: status
      in: query
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    StudioConfig:
      type: object
      required: [branding, navigation, slides, videos, homeSections, pages, banners, campaigns]
      properties:
        branding: { $ref: "#/components/schemas/StudioBranding" }
        navigation:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/StudioNavItem" }
        slides:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/StudioSlide" }
        videos:
          type: array
          maxItems: 20
